name: Rust workspace

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace gates
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/openoj_test
      OPENOJ_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/openoj_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: openoj_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openoj_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install PostgreSQL client for process tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run tests
        run: cargo test --workspace --all-targets --locked
      - name: Check workspace dependency direction
        run: python3 scripts/check-workspace.py
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, dependency bans, and sources
        run: cargo deny --locked check advisories bans sources
