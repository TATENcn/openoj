name: Architecture RFC
description: Propose a cross-cutting or high-migration-cost architecture decision
title: "RFC: "
labels:
  - architecture
  - rfc
body:
  - type: input
    id: refs
    attributes:
      label: Requirement, risk, and ADR references
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and constraints
      description: Define the required capability, current boundary, non-goals, and evidence.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Viable alternatives
      description: Compare security, performance, compatibility, migration, operations, license, maintenance, and removal cost.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed decision
      description: Include invariants, data flow, failure behavior, ownership, and unsupported cases.
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: Migration, rollback, and validation
    validations:
      required: true
  - type: textarea
    id: approvals
    attributes:
      label: Required human approvals
      description: Agents may prepare an ADR but cannot accept it.
    validations:
      required: true
