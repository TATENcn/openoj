[workspace]
resolver = "3"
members = [
    "crates/openoj-application",
    "crates/openoj-domain",
    "crates/openoj-protocol",
    "crates/openoj-storage",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
jsonschema = { version = "=0.49.9", default-features = false }
openoj-application = { path = "crates/openoj-application" }
openoj-domain = { path = "crates/openoj-domain" }
openoj-protocol = { path = "crates/openoj-protocol" }
openoj-storage = { path = "crates/openoj-storage" }
regress = "=0.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "tls-rustls-ring-native-roots"] }
tokio = { version = "=1.53.1", default-features = false }
typify = "=0.7.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
