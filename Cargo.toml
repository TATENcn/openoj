[workspace]
resolver = "3"
members = [
    "apps/openoj-cli",
    "apps/openoj-control-plane",
    "apps/openoj-judge-node",
    "crates/openoj-application",
    "crates/openoj-domain",
    "crates/openoj-firecracker",
    "crates/openoj-guest-agent",
    "crates/openoj-guest-protocol",
    "crates/openoj-judge-core",
    "crates/openoj-judge-protocol",
    "crates/openoj-protocol",
    "crates/openoj-storage",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
jsonschema = { version = "=0.49.9", default-features = false }
getrandom = "=0.3.4"
hex = "=0.4.3"
openoj-application = { path = "crates/openoj-application" }
openoj-domain = { path = "crates/openoj-domain" }
openoj-guest-protocol = { path = "crates/openoj-guest-protocol" }
openoj-guest-agent = { path = "crates/openoj-guest-agent" }
openoj-judge-core = { path = "crates/openoj-judge-core" }
openoj-judge-protocol = { path = "crates/openoj-judge-protocol" }
openoj-protocol = { path = "crates/openoj-protocol" }
openoj-storage = { path = "crates/openoj-storage" }
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
protoc-bin-vendored = "=3.2.0"
regress = "=0.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "tls-rustls-ring-native-roots"] }
tokio = { version = "=1.53.1", default-features = false }
tokio-stream = { version = "=0.1.19", default-features = false }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "=0.14.6"
tonic-prost-build = { version = "=0.14.6", default-features = false, features = ["transport"] }
typify = "=0.7.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
